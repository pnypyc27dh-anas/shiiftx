name: Auto Build Tailwind CSS

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'js/**'
      - 'css/input.css'
      - 'tailwind.config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tailwind CSS
        run: npm install -D tailwindcss

      - name: Build and Minify CSS
        run: npx tailwindcss -i ./css/input.css -o ./css/style.css --minify

      - name: Commit and push compiled CSS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add css/style.css
          git diff --staged --quiet || (git commit -m "chore: auto-compile css/style.css [skip ci]" && git push)
